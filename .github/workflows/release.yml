name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history to read all tags

      # The in-app updater installs a release only when the version inside
      # the zip's _meta.lua equals the tag (anything else is treated as a
      # bad download). A tag pushed without bumping _meta.lua would publish
      # a release nobody can install from the device, so stop here instead.
      - name: Check tag matches _meta.lua version
        run: |
          META_VERSION=$(sed -n 's/^ *version *= *"\([^"]*\)".*/\1/p' _meta.lua)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "_meta.lua: $META_VERSION, tag: $TAG_VERSION"
          if [ "$META_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match _meta.lua version $META_VERSION"
            exit 1
          fi

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current --strip all
        env:
          OUTPUT: CHANGES.md

      - name: Build release archive
        run: |
          mkdir -p /tmp/release/wizlight.koplugin
          cp -r . /tmp/release/wizlight.koplugin
          rm -rf /tmp/release/wizlight.koplugin/.git
          rm -rf /tmp/release/wizlight.koplugin/.github
          rm -rf /tmp/release/wizlight.koplugin/docs
          rm -rf /tmp/release/wizlight.koplugin/.claude
          rm -f  /tmp/release/wizlight.koplugin/.gitignore
          rm -f  /tmp/release/wizlight.koplugin/.luacheckrc
          rm -f  /tmp/release/wizlight.koplugin/cliff.toml
          rm -f  /tmp/release/wizlight.koplugin/README.md
          rm -f  /tmp/release/wizlight.koplugin/CHANGES.md
          rm -f  /tmp/release/wizlight.koplugin/LICENSE
          cd /tmp/release
          zip -r wizlight.koplugin.zip wizlight.koplugin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WiZ Light ${{ github.ref_name }}"
          body: "${{ steps.git-cliff.outputs.content }}"
          files: /tmp/release/wizlight.koplugin.zip
          draft: false
          prerelease: false
